<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Albums | ECA Website Admin</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="albums">
  <div class="admin">
    <aside class="sidebar" id="sidebar"></aside>
    <header class="mobilebar" id="mobileBar"></header>

    <main class="main" id="main">
      <div class="page-head">
        <div>
          <h1 class="page-title">Albums</h1>
          <p class="page-head__sub">Photos from school activities. Published albums appear in <strong>Life at ECA</strong> on the website.</p>
        </div>
        <a href="album-form.html" class="btn btn--primary btn--lg">+ New Album</a>
      </div>

      <!-- ===== What the homepage shows right now ===== -->
      <section class="card homepage-strip" aria-labelledby="homepageTitle">
        <div class="card__head">
          <h2 class="card__title" id="homepageTitle">On the homepage now</h2>
        </div>
        <p class="field__hint">The homepage shows <strong>6 albums</strong>: pinned albums first, then the newest. To pin one, open it and tick "Pin to homepage".</p>
        <ol class="homepage-strip__list" id="homepageList">
          <li class="item-list__empty">Loading…</li>
        </ol>
      </section>

      <!-- ===== Filters ===== -->
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="Show">
          <button type="button" class="segmented__btn" data-status="all" aria-pressed="true">All (<span id="countAll">0</span>)</button>
          <button type="button" class="segmented__btn" data-status="published" aria-pressed="false">Published (<span id="countPublished">0</span>)</button>
          <button type="button" class="segmented__btn" data-status="draft" aria-pressed="false">Drafts (<span id="countDraft">0</span>)</button>
        </div>
        <label for="search" class="sr-only">Search albums</label>
        <input type="search" id="search" class="input toolbar__search" placeholder="Search by title…">
      </div>

      <!-- ===== List ===== -->
      <section class="table-card" aria-label="Albums">
        <div class="table-head" aria-hidden="true">
          <span>Cover</span><span>Album</span><span>Date</span><span>Status</span><span>Actions</span>
        </div>
        <ul class="table-list" id="albumList">
          <li class="item-list__empty">Loading…</li>
        </ul>
      </section>

      <div class="pager">
        <span id="pagerText"></span>
        <div class="pager__buttons">
          <button type="button" class="btn btn--outline" id="prevPage">Previous</button>
          <button type="button" class="btn btn--outline" id="nextPage">Next</button>
        </div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Admin sections"></nav>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/facebook-share.js"></script>
  <script src="js/albums-list.js"></script>
</body>
</html>
